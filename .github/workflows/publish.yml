name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# GitHub Actions doesn't allow `secrets.X != ''` inside an `if:` expression,
# so we hoist the credentials to the job-level env and gate the deploy step
# with `env.OSSRH_USERNAME != ''`. The build + test steps run unconditionally
# on every tag push; the deploy step skips cleanly when secrets are missing.
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify -Dgpg.skip=true
      - name: Already on Central?
        id: central
        run: |
          ver=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          art=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          grp=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.groupId | tr '.' '/')
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/${grp}/${art}/${ver}/${art}-${ver}.jar")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${grp}/${art}/${ver} is already on Maven Central; skipping deploy."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import signing key
        if: env.OSSRH_USERNAME != '' && steps.central.outputs.published != 'true'
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Deploy to Maven Central
        if: env.OSSRH_USERNAME != '' && steps.central.outputs.published != 'true'
        run: mvn -B -DskipTests -Dgpg.skip=false deploy --settings .mvn/settings.xml
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Skip deploy (no OSSRH secrets)
        if: env.OSSRH_USERNAME == ''
        run: echo "::notice::OSSRH credentials not set; skipping deploy."
